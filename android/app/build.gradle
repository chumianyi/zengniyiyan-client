plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "cn.zengniyiyan.app"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "cn.zengniyiyan.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def keystoreFile = file("keystore/zengniyiyan.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword "zengniyiyan123"
                keyAlias "zengniyiyan"
                keyPassword "zengniyiyan123"
            }
        }
    }

    buildTypes {
        release {
            if (file("keystore/zengniyiyan.jks").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.12.0"
}
