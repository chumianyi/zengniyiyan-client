name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: 构建 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查 Android SDK（运行器已预装）
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 生成签名密钥库
        run: |
          mkdir -p android/app/keystore
          keytool -genkeypair -v -noprompt \
            -keystore android/app/keystore/zengniyiyan.jks -alias zengniyiyan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zengniyiyan123 -keypass zengniyiyan123 \
            -dname "CN=Zengniyiyan, OU=Zengniyiyan, O=Zengniyiyan, L=Beijing, S=Beijing, C=CN"

      - run: flutter pub get

      - name: 写入 local.properties
        run: |
          FLUTTER_BIN="$(readlink -f "$(which flutter)")"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          echo "flutter.sdk=$FLUTTER_SDK" > android/local.properties
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> android/local.properties
          cat android/local.properties

      - run: flutter build apk --release

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zengniyiyan-1.0.0-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zengniyiyan-release-apk
          path: 'build/app/outputs/flutter-apk/*.apk'
          if-no-files-found: error
          retention-days: 90
